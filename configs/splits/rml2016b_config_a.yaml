name: rml2016b_config_a
dataset_path: data/RML2016.10b.dat
seed: 42

snr_min: 0
snr_max: 18
stress_snrs: [-10, -8, -6, -4, -2]

ratios:
  train: 0.6
  val: 0.2
  test: 0.2

known_classes:
  - "8PSK"
  - "BPSK"
  - "CPFSK"
  - "GFSK"
  - "PAM4"
  - "QAM16"
  - "QPSK"

unknown_classes:
  - "QAM64"
  - "WBFM"
  - "AM-DSB"

arrival_orders:
  order_clean:
    - ["QAM64", "WBFM"]
    - ["AM-DSB"]
