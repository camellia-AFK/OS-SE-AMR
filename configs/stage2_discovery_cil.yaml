split_config: configs/splits/config_a.yaml
seed: 42
device: cuda
output_dir: outputs/stage2

stage0_checkpoint: outputs/stage0/tldnn_config_a_seed42/checkpoints/best.pt
stage1_osr_state: outputs/stage1/tldnn_ms_maha_config_a_seed42/checkpoints/osr_state.pt

model:
  name: tldnn
  feature_dim: 64
  dropout: 0.1
  tldnn:
    input_mode: iq_ap
    d_model: 64
    nhead: 4
    num_transformer_layers: 2
    lstm_hidden: 64
    lstm_layers: 2

discovery:
  samples_per_class: 1000
  feature_mode: stem_preln
  min_cluster_size: 50
  min_samples: 20
  silhouette_threshold: 0.45
  core_prob_threshold: 0.50
  core_top_ratio: 0.85

continual:
  exemplars_per_class: 100
  ablation_exemplars_per_class: 30
  selection_strategy: herding
  epochs: 35
  steps_per_epoch: 30
  samples_per_class_per_step: 24
  batch_size_new: 128
  batch_size_old: 128
  lr: 8.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  beta_feat: 0.05
  beta_logit: 0.5
  distill_temp: 2.0
  use_rf_aug: true
  bic_max_steal: 0.046
